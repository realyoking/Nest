  <body>
    <div id="root"></div>
    <script>
      // Boot watchdog (2026-10-18): if the app has not rendered after 9 s (stuck service worker / failed bundle),
      // drop the service worker + caches once per session and reload; otherwise show a reload link instead of a blank page.
      setTimeout(function () {
        var r = document.getElementById('root'); if (!r) return;
        // The root page ships static landing content in #root (id="seo"); only a child React rendered counts as booted.
        for (var c = r.firstElementChild; c; c = c.nextElementSibling) if (c.id !== 'seo') return;
        var k = 'nest.bootRescue', last = 0; try { last = +sessionStorage.getItem(k) || 0; } catch (e) {}
        if (Date.now() - last > 60000) {
          try { sessionStorage.setItem(k, String(Date.now())); } catch (e) {}
          var done = function () { location.reload(); };
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (l) { return Promise.all(l.map(function (x) { return x.unregister(); })); }));
          if (window.caches && caches.keys) jobs.push(caches.keys().then(function (l) { return Promise.all(l.map(function (x) { return caches.delete(x); })); }));
          Promise.all(jobs).then(done, done); return;
        }
        r.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 16px system-ui,sans-serif;color:#111"><b>Nest 載入時間較長 · Nest is taking a while</b><a href="" onclick="location.reload();return false" style="color:#111">重新載入 · Reload</a></div>';
      }, 9000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
